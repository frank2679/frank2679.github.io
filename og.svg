  <circle cx="1010" cy="105" r="215" fill="#00d4aa" fill-opacity=".10" filter="url(#glow)"/>
  <g transform="translate(805 168)" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".9">
    <rect x="0" y="0" width="245" height="245" rx="18"/>
    <rect x="34" y="34" width="177" height="177" rx="10"/>
    <path d="M-40 52H0M-40 112H0M-40 172H0M245 52H285M245 112H285M245 172H285M52-40V0M112-40V0M172-40V0M52 245V285M112 245V285M172 245V285"/>
    <circle cx="82" cy="82" r="16" fill="#00d4aa"/><circle cx="164" cy="82" r="16" fill="#00d4aa" fill-opacity=".6"/>
    <circle cx="82" cy="164" r="16" fill="#00d4aa" fill-opacity=".6"/><circle cx="164" cy="164" r="16" fill="#00d4aa"/>
  </g>
  <rect x="80" y="117" width="104" height="34" rx="17" fill="#00d4aa" fill-opacity=".16" stroke="#00d4aa" stroke-opacity=".5"/>
